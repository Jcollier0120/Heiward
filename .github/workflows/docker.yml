name: Docker (Web UI)

# The image of the web app Heiward inherited from Video Duplicate Finder, which Heiward doesn't ship (it
# ships hei.exe through HEI.Agent/release.ps1). It used to build for linux amd64 and arm64 under QEMU on
# every push to every branch. Now it runs only when started by hand (Actions > Docker (Web UI) > Run
# workflow). The file stays because docker-compose.yml names the image it publishes.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only master and version tags publish; other branches just check that the image builds.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag (v4.1.1) publishes :4.1.1 and leaves :latest to master.
      - name: Choose image tags
        id: tags
        shell: bash
        run: |
          # Image names must be lowercase, and the owner (Jcollier0120) isn't.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hei-web"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MOVING="$IMAGE:${GITHUB_REF_NAME#v}"
          else
            MOVING="$IMAGE:latest"
          fi
          {
            echo "list<<EOF"
            echo "$MOVING"
            echo "$IMAGE:${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push hei-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: HEI.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
