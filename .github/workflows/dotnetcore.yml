name: Windows 64-bit

# Every pull request, on an x64 PC (Heiward is developed on an ARM64 one): build hei.exe the
# way release.ps1 does, for both architectures it ships, and run the suites that cover it.
# The GUI, CLI and Web apps from VDF aren't built or tested here: Heiward doesn't ship them.
on: [pull_request]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    # The Steward's kit at the version kit.json pins, from its public release (HEI.Agent/README.md, "The kit"):
    # the tests run the NPU queue's shared cases from it. In Windows PowerShell, as on the PCs that build Heiward.
    - name: Fill the Steward's kit
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\kit.ps1
    - name: Build Heiward (x64)
      run: dotnet publish HEI.Agent/HEI.Agent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -nologo -v q
    - name: Build Heiward (arm64)
      id: build
      run: dotnet publish HEI.Agent/HEI.Agent.csproj -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -nologo -v q
    # Every suite reports, also when one before it failed. None runs when the build
    # failed (a skipped arm64 build means the x64 one failed).
    - name: Run Unit Tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: dotnet test HEI.Core.Tests/HEI.Core.Tests.csproj -c Release -v q
    - name: Run Heiward Tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: dotnet test HEI.Agent.Tests/HEI.Agent.Tests.csproj -c Release -v q
    # FFmpeg 9.0.2's essentials build, the one Chocolatey's ffmpeg package carried, from its maker's own GitHub
    # releases (Gyan's codexffmpeg) and checked against its SHA-256. Chocolatey's community feed answered 503 from
    # 2026-10-19, and choco still exited 0, so the integration tests ran without FFmpeg and 92 failed. Here a download
    # or a check that fails, fails this step.
    - name: Install FFmpeg
      id: ffmpeg
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      env:
        FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
        FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        $into = Join-Path $env:RUNNER_TEMP 'ffmpeg'
        Invoke-WebRequest $env:FFMPEG_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
        $got = (Get-FileHash $zip -Algorithm SHA256).Hash
        if ($got -ne $env:FFMPEG_SHA256) { throw "ffmpeg.zip's SHA-256 is $got, not $env:FFMPEG_SHA256" }
        Expand-Archive $zip -DestinationPath $into
        $bin = (Get-ChildItem $into -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
        if (-not $bin) { throw "the archive has no ffmpeg.exe" }
        (& (Join-Path $bin 'ffmpeg.exe') -hide_banner -version)[0]
        Add-Content $env:GITHUB_PATH $bin
    - name: Run Integration Tests
      if: ${{ !cancelled() && steps.ffmpeg.outcome == 'success' }}
      run: dotnet test HEI.IntegrationTests/HEI.IntegrationTests.csproj -c Release -v normal
