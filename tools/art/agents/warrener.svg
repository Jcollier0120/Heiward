<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Warrener's mark: a rabbit sitting up, ears raised. Light and Dark.
       The body is drawn twice, outlined and then filled, so overlapping parts share one outline. -->
  <style>
    .back { fill: #eef2dc; stroke: #4c5e1a; }
    .fill { fill: #eef2dc; }
    .front { fill: #4c5e1a; }
    .line { stroke: #4c5e1a; }
    @media (prefers-color-scheme: dark) {
      .back { fill: #1e2510; stroke: #c2d889; }
      .fill { fill: #1e2510; }
      .front { fill: #c2d889; }
      .line { stroke: #c2d889; }
    }
  </style>
  <g transform="translate(-1.2 0.5)">
    <g class="back" stroke-width="1.6">
      <ellipse cx="7.6" cy="4.4" rx="1.35" ry="3.5" transform="rotate(-6 7.6 4.4)"/>
      <ellipse cx="11" cy="4.9" rx="1.3" ry="3.4" transform="rotate(26 11 4.9)"/>
      <circle cx="8" cy="10.6" r="3.4"/>
      <ellipse cx="14.2" cy="16.6" rx="6.2" ry="4.9"/>
      <ellipse cx="9.6" cy="16.2" rx="3" ry="4.4"/>
      <ellipse cx="7.6" cy="20.9" rx="1.9" ry="0.9"/>
      <circle cx="20.3" cy="15.6" r="1.6"/>
    </g>
    <g class="fill">
      <ellipse cx="7.6" cy="4.4" rx="1.35" ry="3.5" transform="rotate(-6 7.6 4.4)"/>
      <ellipse cx="11" cy="4.9" rx="1.3" ry="3.4" transform="rotate(26 11 4.9)"/>
      <circle cx="8" cy="10.6" r="3.4"/>
      <ellipse cx="14.2" cy="16.6" rx="6.2" ry="4.9"/>
      <ellipse cx="9.6" cy="16.2" rx="3" ry="4.4"/>
      <ellipse cx="7.6" cy="20.9" rx="1.9" ry="0.9"/>
      <circle cx="20.3" cy="15.6" r="1.6"/>
    </g>
    <path class="line" fill="none" stroke-width="1.2" stroke-linecap="round" d="M13.4 20.9c0-2.7 1.9-4.6 4.6-4.6"/>
    <circle class="front" cx="6.9" cy="10.2" r="0.9"/>
  </g>
</svg>
