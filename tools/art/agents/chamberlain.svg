<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Chamberlain's mark: a letter closed with a wax seal, a keyhole pressed in the wax. Light and Dark. -->
  <style>
    .back { fill: #f6e1e4; stroke: #7a1d2c; }
    .front { fill: #7a1d2c; }
    .line { stroke: #7a1d2c; }
    .cut { fill: #f6e1e4; }
    @media (prefers-color-scheme: dark) {
      .back { fill: #2b1216; stroke: #eea4ae; }
      .front { fill: #eea4ae; }
      .line { stroke: #eea4ae; }
      .cut { fill: #2b1216; }
    }
  </style>
  <rect class="back" x="1.8" y="4.8" width="20.4" height="14.4" rx="1.8" stroke-width="1.6"/>
  <path class="line" fill="none" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" d="M2.8 6l9.2 7.2L21.2 6"/>
  <path class="line" fill="none" stroke-width="1.2" stroke-linecap="round" d="M2.8 18.2l6.2-5M21.2 18.2l-6.2-5"/>
  <circle class="front" cx="12" cy="13.4" r="3.9"/>
  <circle class="cut" cx="12" cy="12.6" r="1.05"/>
  <path class="cut" d="M11.45 13.1h1.1l0.45 2.6h-2z"/>
</svg>
