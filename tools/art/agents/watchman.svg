<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The Watchman's mark: the night watch's lantern, lit, with a curved arrow round it: the way back. Light and Dark. -->
  <style>
    .back { fill: #e8eefb; stroke: #24467a; }
    .front { fill: #24467a; }
    .glow { fill: #e0a43a; }
    .line { stroke: #24467a; }
