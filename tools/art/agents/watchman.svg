      .back { fill: #172338; stroke: #9cc0f5; }
      .front { fill: #9cc0f5; }
      .glow { fill: #f2c46d; }
      .line { stroke: #9cc0f5; }
    }
  </style>
  <path class="line" fill="none" stroke-width="1.5" stroke-linecap="round" d="M3.6 12a8.4 8.4 0 1 0 2.5-6"/>
